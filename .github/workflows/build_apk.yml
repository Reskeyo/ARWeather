name: Build & Release Fast Debug APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build Fast Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java Setup ────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Flutter Setup (pinned version with cache) ─────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # ── Write local.properties ────────────────────────────────
      - name: Write android/local.properties
        run: |
          cat > android/local.properties << EOF
          sdk.dir=$ANDROID_HOME
          flutter.sdk=$FLUTTER_ROOT
          flutter.compileSdkVersion=35
          flutter.targetSdkVersion=35
          flutter.minSdkVersion=21
          flutter.versionCode=1
          flutter.versionName=1.0.0
          EOF

      # ── Dependencies ──────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── Build Fast Debug APK ──────────────────────────────────
      - name: Build APK (debug)
        run: flutter build apk --debug

      # ── Upload APK artifact ───────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ar-weather-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # ── Create GitHub Release ─────────────────────────────────
      - name: Generate release tag
        id: tag
        run: echo "tag=v$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      # ── Create GitHub Release ─────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 'AR Weather Fast Debug ${{ steps.tag.outputs.tag }}'
          body: |
            ⚡ **AR Weather (Fast Debug Build)**

            Built from commit `${{ github.sha }}`.

            ### 📲 Fast Installation
            1. Download `app-debug.apk` below
            2. Install on Android device
          files: build/app/outputs/flutter-apk/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true

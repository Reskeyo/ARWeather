name: Build & Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java Setup (required for Android builds) ──────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Flutter Setup ─────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # ── Dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Build Release APK ─────────────────────────────────────
      - name: Build APK (release)
        run: flutter build apk --release

      # ── Upload as Artifact ────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ar-weather-release
          path: build/app/outputs/flutter-apk/app-release.apk

      # ── Create GitHub Release ─────────────────────────────────
      - name: Generate release tag
        id: tag
        run: echo "tag=v1.0.0-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 'AR Weather ${{ steps.tag.outputs.tag }}'
          body: |
            🌤️ **AR Weather** — Automated Release Build
            
            Built from commit `${{ github.sha }}`.
            
            ### Download
            Download the `app-release.apk` file below and install on your Android device.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

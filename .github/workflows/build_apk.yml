name: Build & Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java Setup (required for Android builds) ──────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Flutter Setup ─────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── Verify Flutter installation ───────────────────────────
      - name: Flutter version info
        run: flutter --version

      # ── Write local.properties (needed by Gradle) ─────────────
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

      # ── Dependencies ──────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── Build Release APK ─────────────────────────────────────
      - name: Build APK (release)
        run: flutter build apk --release --no-shrink

      # ── Upload as workflow Artifact ───────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ar-weather-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── Create GitHub Release ─────────────────────────────────
      - name: Generate release tag
        id: tag
        run: echo "tag=v$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 'AR Weather ${{ steps.tag.outputs.tag }}'
          body: |
            🌤️ **AR Weather** — Automated Release Build
            
            Built from commit `${{ github.sha }}`.
            
            ### 📲 Installation
            1. Download `app-release.apk` below
            2. Transfer to your Android device
            3. Enable "Install from unknown sources" in Android settings
            4. Install the APK
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

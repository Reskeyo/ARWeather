name: ar_weather
description: A visually stunning AR Weather app with real-time camera overlay and glassmorphism UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # HTTP & API
  http: ^1.2.1
  # Location & Sensors
  geolocator: ^12.0.0
  flutter_compass: ^0.8.0
  sensors_plus: ^5.0.1
  # Camera
  camera: ^0.11.0+2
  # Permissions
  permission_handler: ^11.3.1
  # Google Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

# Pin geolocator_android to 4.6.1 — 4.6.2 has a known Gradle build bug
# where its build.gradle accesses `flutter.compileSdkVersion` which is
# unavailable in plugin subprojects, causing build failures on CI.
dependency_overrides:
  geolocator_android: 4.6.1

flutter:
  uses-material-design: true
